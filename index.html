<!DOCTYPE html>

<html lang="es">

<head>

  <!-- =====================================================
       CONFIGURACIÓN GENERAL
  ====================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#17395f"
  >

  <meta
    name="description"
    content="Itinerario Islandia 2026 · viaje en camper"
  >


  <title>Islandia 2026</title>


  <!-- =====================================================
       CSS PRINCIPAL
  ====================================================== -->

  <link
    rel="stylesheet"
    href="./css/styles.css?v=7"
  >


  <!-- =====================================================
       LEAFLET · CSS DEL MAPA
  ====================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

</head>



<body>


  <!-- =====================================================
       CABECERA
  ====================================================== -->

  <header>

    <div class="topbar">

      <div class="brand">

        <h1>
          Islandia 2026
        </h1>

        <p>
          Roadtrip en camper · Septiembre
        </p>

      </div>

    </div>



    <!-- ===================================================
         NAVEGACIÓN PRINCIPAL
    ==================================================== -->

    <nav
      class="days-nav"
      aria-label="Días del itinerario"
    >


      <!-- DÍA 1 -->

      <button
        type="button"
        class="day active"
        data-day="1"
      >

        <span>
          DÍA 1
        </span>

        <small>
          MIÉ 9
        </small>

      </button>



      <!-- DÍA 2 -->

      <button
        type="button"
        class="day"
        data-day="2"
      >

        <span>
          DÍA 2
        </span>

        <small>
          JUE 10
        </small>

      </button>



      <!-- DÍA 3 -->

      <button
        type="button"
        class="day"
        data-day="3"
      >

        <span>
          DÍA 3
        </span>

        <small>
          VIE 11
        </small>

      </button>



      <!-- DÍA 4 -->

      <button
        type="button"
        class="day"
        data-day="4"
      >

        <span>
          DÍA 4
        </span>

        <small>
          SÁB 12
        </small>

      </button>



      <!-- DÍA 5 -->

      <button
        type="button"
        class="day"
        data-day="5"
      >

        <span>
          DÍA 5
        </span>

        <small>
          DOM 13
        </small>

      </button>



      <!-- DÍA 6 -->

      <button
        type="button"
        class="day"
        data-day="6"
      >

        <span>
          DÍA 6
        </span>

        <small>
          LUN 14
        </small>

      </button>



      <!-- MAPA -->

      <button
        type="button"
        class="day map-tab"
      >

        <span>
          🗺️ MAPA
        </span>

        <small>
          VIAJE
        </small>

      </button>


    </nav>

  </header>



  <!-- =====================================================
       CONTENIDO PRINCIPAL
  ====================================================== -->

  <main>


    <!-- ===================================================
         ITINERARIO

         app.js introduce aquí automáticamente:

         - Hero
         - Presupuesto
         - Timeline
         - Trayectos
         - Actividades
         - Parkings
         - Reservas
         - Notas
         - Opciones para dormir
    ==================================================== -->

    <div class="content">

      <!--
        El contenido se genera automáticamente
        desde data.js mediante app.js.
      -->

    </div>



    <!-- ===================================================
         MAPA
    ==================================================== -->

    <section
      id="map-section"
      class="hidden"
    >


      <!-- CABECERA MAPA -->

      <div class="map-header">

        <p class="eyebrow">
          MAPA DEL VIAJE
        </p>

        <h2>
          Islandia · nuestra ruta
        </h2>

        <p>
          Podemos ver todo el viaje, un día concreto,
          los campings o los supermercados útiles
          de nuestra ruta.
        </p>

      </div>



      <!-- ===============================================
           FILTROS

           map.js crea aquí automáticamente:

           TODO
           DÍA 1
           DÍA 2
           DÍA 3
           DÍA 4
           DÍA 5
           DÍA 6
           CAMPINGS
           SUPERMERCADOS
      ================================================ -->

      <div class="map-filters">

        <!--
          Los botones se generan automáticamente
          desde map.js.
        -->

      </div>



      <!-- ===============================================
           MAPA LEAFLET
      ================================================ -->

      <div
        id="map"
        aria-label="Mapa del itinerario por Islandia"
      ></div>


    </section>


  </main>



  <!-- =====================================================
       JAVASCRIPT

       IMPORTANTE:

       EL ORDEN ES:

       1. Leaflet
       2. data.js
       3. places.js
       4. app.js
       5. map.js
  ====================================================== -->


  <!-- LEAFLET -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>



  <!-- ===================================================
       DATOS DEL ITINERARIO
  ==================================================== -->

  <script
    src="./js/data.js?v=7"
  ></script>



  <!-- ===================================================
       CAMPINGS + SUPERMERCADOS
  ==================================================== -->

  <script
    src="./js/places.js?v=7"
  ></script>



  <!-- ===================================================
       LÓGICA DE LA WEB
  ==================================================== -->

  <script
    src="./js/app.js?v=7"
  ></script>



  <!-- ===================================================
       LÓGICA DEL MAPA
  ==================================================== -->

  <script
    src="./js/map.js?v=7"
  ></script>


</body>

</html>
